<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתכנן הטיול לגדנסק</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@700;800&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D3DAE1;
  --ink:#172230; --ink-2:#4E5D6C; --ink-3:#7B8894;
  --amber:#D99A2B; --amber-ink:#8A5D0E; --amber-soft:#FBF1DD;
  --ok:#2E8B57; --warn:#C0392B;
  --shadow:0 1px 2px rgba(23,34,48,.06),0 8px 24px rgba(23,34,48,.08);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#111820; --surface:#18222C; --surface-2:#1F2B37; --line:#2E3B48;
    --ink:#E8EEF3; --ink-2:#AAB7C3; --ink-3:#7D8A96;
    --amber:#E8B04A; --amber-ink:#F1C97A; --amber-soft:#2C2412;
    --ok:#5DC48A; --warn:#E8705F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:Rubik,Heebo,Arial,sans-serif;margin:0;text-wrap:balance}
button{font:inherit}
a{color:var(--amber-ink)}

.app{display:grid;grid-template-columns:minmax(360px,520px) minmax(0,1fr);grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800}
.top .sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.top .sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.top .sync.on i{background:var(--ok)}
.top .sync.err i{background:var(--warn)}
.top .spacer{flex:1}
.tabs{display:flex;gap:4px}
.mob{display:none!important}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.side{overflow-y:auto;border-inline-start:1px solid var(--line);background:var(--bg);padding:14px 16px 80px;display:flex;flex-direction:column;gap:14px}
.mapwrap{position:relative;min-height:0}
.summary-view{display:none;grid-column:1/-1;overflow-y:auto;padding:16px;background:var(--bg)}
.app[data-view="summary"] .summary-view{display:block}
.app[data-view="summary"] .side,.app[data-view="summary"] .mapwrap{display:none}
.sum-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.sum-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-family:Rubik,Heebo,sans-serif;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.sum-h{font-size:16px;margin-top:6px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:12px;color:var(--ink-3);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:130px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-cell.pad{background:transparent;border:0;cursor:default}
.cal-cell.empty{border-style:dashed}
.cal-cell.active{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}
.cal-cell:hover:not(.pad){border-color:var(--ink-3)}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cal-head b{font-family:Rubik,Heebo,sans-serif;font-size:14px}
.cal-title{font-size:13px;font-weight:700;color:var(--amber-ink)}
.cal-meta{font-size:11px;color:var(--ink-3)}
.cal-stops{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal-stops li{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-stops i{width:7px;height:7px;border-radius:50%;flex:none}
.cal-stops .more{color:var(--ink-3)}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.ins{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ins-ico{font-size:20px}
.ins-t{font-size:13px;color:var(--ink-2);margin-top:2px}
.ins-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dayhandle{cursor:grab;color:var(--ink-3);font-size:15px;padding:2px 4px;border:0;background:none;line-height:1;touch-action:none}
.day.sortable-ghost{opacity:.4}
.day.swap-target{outline:2px dashed var(--amber)}
@media (max-width:860px){
  .mob{display:inline-flex!important}
  .cal{grid-template-columns:repeat(2,1fr)}
  .cal-week,.cal-cell.pad{display:none}
}
#map{position:absolute;inset:0}
.mapbar{position:absolute;top:10px;right:10px;left:70px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.mapfilter{position:absolute;top:52px;right:10px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:min(420px,calc(100% - 20px));box-shadow:var(--shadow)}
@media (max-width:860px){.mapfilter{top:auto;bottom:110px;left:10px}}
.mapbar .chip{pointer-events:auto}
.legend{position:absolute;bottom:26px;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .tabs{display:flex}
  .side{border:0}
  .app[data-view="map"] .side{display:none}
  .app[data-view="plan"] .mapwrap,.app[data-view="pool"] .mapwrap{display:none}
  .app[data-view="plan"] .pool{display:none}
  .app[data-view="pool"] .settings-card,.app[data-view="pool"] .daysbar,.app[data-view="pool"] #days{display:none}
  .app[data-view="pool"] .pitems{max-height:none}
  .desk{display:none!important}
}
.daysbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.daysbar .hint{margin-inline-start:auto}
.dayhead .t .mini{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead.dropping{outline:2px dashed var(--amber);outline-offset:-2px}
.pool .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.addplace{display:flex;gap:6px;margin-bottom:8px}
.addplace input{flex:1;min-width:0}
.gres{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:380px;overflow-y:auto}
.gitem{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.gitem b{font-size:14px}
.gitem .meta{font-size:12px;color:var(--ink-2)}
.gres .hint{padding:4px 2px}
.gadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.gadd select{font-size:12px;padding:4px 6px;max-width:130px}
.pitem .dup{margin-top:4px;font-size:12px;color:var(--warn)}
.pitem .dup .link{color:var(--amber-ink);margin-inline-start:6px}
.pitem .rm{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
.pitem .rm:hover{background:var(--surface);color:var(--warn)}
.pitem .side{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pool .ph h2{flex:1;cursor:pointer}
.pool.collapsed .ph{margin-bottom:0}
.pool.collapsed > *:not(.ph){display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip.lst.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.lst.on .dot{background:#fff}
.chip.off{opacity:.45}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
.btn.small{padding:3px 9px;font-size:12px}
.btn.icon{padding:3px 7px;font-size:13px;line-height:1}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;resize:vertical;min-height:38px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3)}
label.f > *{font-size:14px;color:var(--ink)}

/* settings */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.settings .hotel{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3)}

/* days */
.day{padding:0;overflow:hidden}
.day.active{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}
.dayhead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.dayhead .num{font-family:Rubik,sans-serif;font-weight:800;font-size:15px;background:var(--surface-2);border-radius:8px;padding:2px 9px;min-width:44px;text-align:center}
.dayhead .t{flex:1;min-width:0}
.dayhead .t b{display:block;font-size:14px}
.dayhead .t span{font-size:12px;color:var(--ink-3)}
.wx{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.wx .ico{font-size:18px}
.wx .rain{color:#3A7BD5}
.daybody{padding:6px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.day.collapsed .daybody{display:none}
.stops{display:flex;flex-direction:column;gap:0;min-height:34px;border-radius:8px}
.stops.empty{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;padding:8px}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
.stop .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.stop .name{font-weight:700;font-size:14px;cursor:pointer}
.stop .meta{font-size:12px;color:var(--ink-3)}
.stop .note{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.stop .own{margin-top:4px}
.stop .own textarea{font-size:13px;min-height:30px;padding:4px 8px}
.stop .acts{display:flex;flex-direction:column;gap:3px}
.stop .handle{cursor:grab;color:var(--ink-3);font-size:16px;text-align:center;user-select:none}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);padding:2px 0 2px 34px;justify-content:flex-start}
.leg::before{content:"";width:2px;height:14px;background:var(--line);margin-inline-start:11px}
.leg b{color:var(--ink-2);font-weight:500}
.legmodes{display:inline-flex;gap:2px;margin-inline-end:6px}
.legmodes .lm{border:1px solid transparent;background:none;border-radius:6px;padding:0 4px;font-size:13px;cursor:pointer;opacity:.45;line-height:1.4}
.legmodes .lm.on{opacity:1;border-color:var(--line);background:var(--surface)}
.legmodes .lm:hover{opacity:1}
.sortable-ghost{opacity:.4}
.sortable-drag{box-shadow:var(--shadow)}
.daytotal{font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.daytotal .warnt{color:var(--warn);font-weight:700}
.tline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:3px}
.tline .tm{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:6px;padding:1px 7px;display:inline-flex;align-items:center;gap:4px}
.tline .tm.fixed{background:var(--amber-soft);color:var(--amber-ink)}
.tline .at{font:inherit;font-size:12px;padding:0 4px;border:1px solid transparent;background:transparent;color:inherit;border-radius:4px;width:7.2em;min-width:7.2em;direction:ltr;font-variant-numeric:tabular-nums}
.tline .at:hover,.tline .at:focus{border-color:var(--line);background:var(--surface)}
.tline .warnt{color:var(--warn);font-size:12px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.tline label{display:inline-flex;gap:5px;align-items:center;color:var(--ink-3)}
.tline select{font-size:12px;padding:2px 6px}
.daynote textarea{font-size:13px}
.dayadd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.dayadd select{font-size:12px;padding:4px 8px;max-width:260px;flex:1;min-width:160px}
.dsearch{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.dsearch .gres{max-height:none}
.lodge{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px}
.lrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lrow .ll{color:var(--ink-3)}
.lrow b{color:var(--ink)}
.ledit{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:4px}
.ledit input{flex:1;min-width:160px;font-size:12px;padding:4px 8px}
.modes{display:inline-flex;gap:4px;flex-wrap:wrap}
.modes .chip{padding:3px 8px;font-size:12px}

/* pool */
.pool .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pool input[type=search]{width:100%;margin-bottom:8px}
.pitems{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:grab}
.pitem .bar{border-radius:3px;background:var(--c)}
.pitem .name{font-weight:700;font-size:14px}
.pitem .name:hover{text-decoration:underline;cursor:pointer}
.pitem .meta{font-size:12px;color:var(--ink-3)}
.pitem .meta .used{color:var(--ok)}
.pitem .note{font-size:12px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem select{font-size:12px;padding:3px 6px;max-width:120px}
.iw{font-family:Heebo,sans-serif;direction:rtl;text-align:right;max-width:280px;color:#172230}
.iw b{display:block;font-size:15px}
.iw .m{font-size:12px;color:#7B8894;margin-bottom:6px}
.iw p{margin:0 0 8px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.iw .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.iw select,.iw button{font:inherit;font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid #D3DAE1;background:#fff;color:#172230}
.iw a{font-size:13px}
.iw .close{margin-inline-start:auto;border:1px solid #D3DAE1;background:#fff;color:#172230;border-radius:6px;padding:3px 10px;font-size:12px}
.gm-style-iw button.gm-ui-hover-effect{color:#172230!important;opacity:.8!important}
.gm-style-iw button.gm-ui-hover-effect > span{background-color:#172230!important}
.gm-style .gm-style-iw-c,.gm-style .gm-style-iw-d{color:#172230}
@media (max-width:860px){
  .mapbar{top:auto;bottom:24px;left:10px;right:10px;flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:2px}
  .mapbar::-webkit-scrollbar{display:none}
  .mapbar .chip{white-space:nowrap;flex:none}
  .legend{bottom:68px;left:10px;right:10px;flex-wrap:nowrap;overflow-x:auto;gap:12px;padding:5px 10px;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .legend span{white-space:nowrap}
}
.ctxmenu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;max-width:270px;display:flex;flex-direction:column;gap:2px}
.ctxmenu .ct{font-weight:700;font-size:13px;padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxmenu .cl{font-size:11px;color:var(--ink-3);padding:0 8px 4px}
.ctxmenu button{text-align:right;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--surface-2);outline:none}
.ctxmenu button .ok{color:var(--ok);font-size:12px}
.ctxmenu button.danger{color:var(--warn);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 6px 6px}
.iw .days{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.iw .days button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid #D3DAE1;background:#fff;color:#172230;cursor:pointer}
.iw .days button.in{background:#FBF1DD;border-color:#D99A2B;color:#8A5D0E}
.iw .lbl{font-size:12px;color:#7B8894;margin-bottom:3px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-view="plan">
  <div class="top">
    <h1>מתכנן הטיול לגדנסק</h1>
    <span class="sync" id="sync"><i></i><span>מתחבר…</span></span>
    <span class="spacer"></span>
    <div class="tabs"><button id="tabPlan" class="on">תכנון</button><button id="tabPool" class="mob">מקומות</button><button id="tabMap" class="mob">מפה</button><button id="tabSummary">סיכום</button></div>
    <a class="btn small" href="places.html">כל המקומות ↗</a>
    <span class="hint" id="buildLbl" title="גרסת הדף"></span>
  </div>

  <aside class="side" id="side">
    <section class="card settings-card">
      <div class="settings">
        <label class="f">תאריך הגעה<input type="date" id="sStart"></label>
        <label class="f">לילות<input type="number" id="sNights" min="1" max="21"></label>
        <label class="f">התניידות (ברירת מחדל)<select id="sMode"><option value="DRIVING">רכב</option><option value="WALKING">הליכה</option><option value="TRANSIT">תחב"צ</option></select></label>
        <div class="hotel">
          <b>לינה (ברירת מחדל):</b> <span id="hotelName">לא הוגדר</span>
          <button class="btn small" id="setHotel">סמן על המפה</button>
          <button class="btn small" id="clearHotel" hidden>הסר</button>
          <span class="hint">נקודת היציאה והסיום של כל יום, אלא אם נקבע אחרת בתוך היום.</span>
        </div>
      </div>
    </section>

    <div class="daysbar" id="daysbar">
      <button class="btn small" id="collapseAll">כווץ הכול</button>
      <button class="btn small" id="expandAll">פתח הכול</button>
      <button class="btn small desk" id="jumpPool">למאגר המקומות ↓</button>
      <span class="hint" id="daysHint"></span>
    </div>

  if (t.dataset.at) { const [i, j] = t.dataset.at.split(':').map(Number); trip.days[i].stops[j].at = /^\d\d:\d\d$/.test(t.value) ? t.value : ''; commit(); }
  if (t.dataset.start !== undefined) { trip.days[+t.dataset.start].start = /^\d\d:\d\d$/.test(t.value) ? t.value : ''; commit(); }
  if (t.dataset.addto && t.value !== '') { addTo(+t.value, t.dataset.addto); }
  if (t.dataset.addfrompool !== undefined && t.value !== '') { addTo(+t.dataset.addfrompool, t.value); }
  if (t.dataset.catof) { const c = (trip.custom || []).find(c => c.id === t.dataset.catof); if (c) { c.list = t.value; const m = markers[c.id]; if (m) { m.setMap(null); delete markers[c.id]; } commit(); toast('הקטגוריה עודכנה'); } }
});
$('#poolQ').addEventListener('input', e => { ui.poolQ = e.target.value; renderPool(); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.dq !== undefined) ui.dq[+e.target.dataset.dq] = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.dq !== undefined) { e.preventDefault(); const i = +e.target.dataset.dq; const q = e.target.value.trim(); if (q) daySearch(i, q); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.lodgeq) { e.preventDefault(); const [i, w] = e.target.dataset.lodgeq.split('|'); const q = e.target.value.trim(); if (q) lodgeSearch(+i, w, q); } });
$('#gq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); if (q) searchPlaces(q); } });

$('#buildLbl').textContent = 'v' + BUILD;
loadLocal(); ensureDays(); render(); initFirebase();
// GitHub Pages lets browsers cache the page for a few minutes; tell the user when a newer build is live
async function checkForUpdate() {
  try {
    const html = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }).then(r => r.text());
    const m = html.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && !document.getElementById('updBar')) {
      const bar = document.createElement('div'); bar.id = 'updBar'; bar.className = 'toast';
      bar.innerHTML = 'עלתה גרסה חדשה של המתכנן. <button class="btn small" type="button" id="updBtn">רענן</button>';
      document.body.appendChild(bar); document.getElementById('updBtn').onclick = () => location.reload();
    }
  } catch (e) {}
}
setTimeout(checkForUpdate, 20000); setInterval(checkForUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
